<?xml version="1.0" encoding="UTF-8"?>
<!-- Icono de DeckLink: la consola (arriba) manda su imagen a otra pantalla (abajo). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25344a"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fb8ff"/>
      <stop offset="1" stop-color="#1a7fe0"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#fondo)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#brillo)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="52.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- consola -->
  <rect x="34" y="52" width="188" height="84" rx="42" fill="#0d1219" stroke="#eaf2fb" stroke-width="9"/>
  <rect x="84" y="68" width="88" height="52" rx="6" fill="url(#azul)"/>
  <circle cx="61" cy="83" r="9" fill="#eaf2fb"/>
  <circle cx="195" cy="83" r="9" fill="#eaf2fb"/>
  <rect x="55" y="105" width="12" height="12" rx="2" fill="#eaf2fb" opacity="0.55"/>
  <circle cx="195" cy="111" r="5" fill="#eaf2fb" opacity="0.55"/>

  <!-- enlace -->
  <path d="M128 140 V164" stroke="#1a9fff" stroke-width="9" stroke-linecap="round"/>
  <path d="M116 156 L128 170 L140 156" fill="none" stroke="#1a9fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pantalla de destino -->
  <rect x="72" y="176" width="112" height="50" rx="9" fill="#0d1219" stroke="#eaf2fb" stroke-width="8"/>
  <rect x="84" y="186" width="88" height="30" rx="3" fill="url(#azul)" opacity="0.9"/>
</svg>
