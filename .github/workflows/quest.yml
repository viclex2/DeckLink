name: Quest (código nativo)

# Compila la parte VR (OpenXR) con el NDK que ya trae el runner y deja las bibliotecas
# en la rama «nativo». scripts/compilar-android.sh las mete en el APK.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/quest/**"
      - "src/protocolo.h"
      - "src/recursos.h"
      - ".github/workflows/quest.yml"

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: OpenXR (cabeceras y cargador de Khronos para Android)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenXR-SDK /tmp/openxr
          mkdir -p /tmp/aar && cd /tmp/aar
          gh release download -R KhronosGroup/OpenXR-SDK-Source --pattern 'openxr_loader_for_android-*.aar' \
             || { V=1.1.49; curl -fsSLO "https://repo1.maven.org/maven2/org/khronos/openxr/openxr_loader_for_android/$V/openxr_loader_for_android-$V.aar"; }
          ls -la
          unzip -o -q *.aar
          find . -path '*arm64-v8a*' -name libopenxr_loader.so

      - name: LiteRT y modelo de profundidad (3D con IA)
        run: |
          mkdir -p /tmp/litert && cd /tmp/litert
          V=1.4.2
          for a in litert litert-gpu; do
            curl -fsSL -o $a.aar "https://dl.google.com/android/maven2/com/google/ai/edge/litert/$a/$V/$a-$V.aar" \
              || curl -fsSL -o $a.aar "https://repo1.maven.org/maven2/com/google/ai/edge/litert/$a/$V/$a-$V.aar"
            mkdir -p $a && (cd $a && unzip -o -q ../$a.aar)
          done
          # ZipDepth (MIT, © Fabio Tosi et al.), convertido a LiteRT por el proyecto Moonlight XR
          curl -fsSL -o zipdepth_512x288_fp16.tflite \
            "https://raw.githubusercontent.com/Gilleece/moonlight-android-xr/75d92f2559a91c92a68f05f14fc472b7284cc034/app/src/main/assets/zipdepth_512x288_fp16.tflite"
          echo "677c7eec5c8e3b7f66a2ebc137b9b0081c7244257f8d0db17a3ecf3e7b0f000b  zipdepth_512x288_fp16.tflite" | sha256sum -c

      - name: Compilar libdecklinkvr.so
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android32-clang"
          GLUE="$NDK/sources/android/native_app_glue"
          LOADER=$(find /tmp/aar -path '*arm64-v8a*' -name libopenxr_loader.so | head -1)
          mkdir -p salida/lib/arm64-v8a
          cp "$LOADER" salida/lib/arm64-v8a/
          cp /tmp/litert/litert/jni/arm64-v8a/libtensorflowlite_jni.so salida/lib/arm64-v8a/
          cp /tmp/litert/litert-gpu/jni/arm64-v8a/libtensorflowlite_gpu_jni.so salida/lib/arm64-v8a/
          mkdir -p salida/assets
          cp /tmp/litert/zipdepth_512x288_fp16.tflite salida/assets/
          "$CC" -shared -fPIC -O2 -Wall -Wno-unused-const-variable -Wno-unused-variable \
            -I/tmp/openxr/include -I"$GLUE" \
            src/quest/decklink-vr.c "$GLUE/android_native_app_glue.c" \
            -Lsalida/lib/arm64-v8a -lopenxr_loader -landroid -llog -lEGL -lGLESv3 -laaudio -ljnigraphics -lm \
            -Wl,-u,ANativeActivity_onCreate -Wl,-z,max-page-size=16384 \
            -o salida/lib/arm64-v8a/libdecklinkvr.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" salida/lib/arm64-v8a/libdecklinkvr.so
          ls -la salida/lib/arm64-v8a salida/assets

      - name: Guardar en la rama «nativo»
        run: |
          cd salida
          git init -q -b nativo
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Bibliotecas de Quest de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" nativo
