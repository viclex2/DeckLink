name: Publicar

on:
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta de la versión (por ejemplo v2.0)"
        required: true
        default: "v2.0"
      titulo:
        description: "Nombre de la release"
        required: true
        default: "DeckLink-V.2"
      pruebas:
        description: "¿Es una versión de pruebas?"
        type: boolean
        default: false
      limpiar_pruebas:
        description: "Borrar antes todas las versiones y etiquetas de pruebas"
        type: boolean
        default: false
      ya_compilado:
        description: "Usar los paquetes ya compilados de la rama «binarios» (sin compilar aquí)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Traer los paquetes ya compilados
        if: ${{ inputs.ya_compilado }}
        run: |
          git fetch --depth 1 origin binarios
          mkdir -p dist
          git --work-tree=dist checkout FETCH_HEAD -- .
          ls -la dist

      - name: Instalar herramientas
        if: ${{ !inputs.ya_compilado }}
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get install -y build-essential cmake nasm pkg-config curl python3 \
            libpipewire-0.3-dev libsystemd-dev libpulse-dev libasound2-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev libegl-dev \
            libgles-dev libgl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxinerama-dev \
            mingw-w64 nsis \
            android-sdk-platform-23 aapt apksigner zipalign dalvik-exchange openjdk-17-jdk-headless

      - name: Compilar y empaquetar todo
        if: ${{ !inputs.ya_compilado }}
        run: scripts/todo.sh

      - name: Borrar las versiones de pruebas
        if: ${{ inputs.limpiar_pruebas }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --limit 200 --json tagName,isPrerelease -q '.[] | select(.isPrerelease) | .tagName'); do
            echo "Borrando la release $t"
            gh release delete "$t" --yes --cleanup-tag
          done
          git fetch --tags --force
          for t in $(git tag -l '*pruebas*'); do
            echo "Borrando la etiqueta $t"
            git push origin ":refs/tags/$t" || true
          done

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ inputs.etiqueta }}
          TITULO: ${{ inputs.titulo }}
          PRUEBAS: ${{ inputs.pruebas }}
        run: |
          gh release view "$ETIQUETA" >/dev/null 2>&1 && gh release delete "$ETIQUETA" --yes --cleanup-tag
          OPC=""
          [ "$PRUEBAS" = "true" ] && OPC="--prerelease"
          gh release create "$ETIQUETA" dist/DeckLink-SteamDeck.zip dist/DeckLink-Linux.zip \
            dist/DeckLink-Windows-Instalador.exe dist/DeckLink-Android.apk \
            --title "$TITULO" --notes-file .github/notas-release.md --target "$GITHUB_SHA" $OPC
