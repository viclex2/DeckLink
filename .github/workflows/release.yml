name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake nasm pkg-config curl python3 \
            libpipewire-0.3-dev libsystemd-dev liblz4-dev libpulse-dev libasound2-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev libegl-dev \
            libgles-dev libgl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxinerama-dev

      - name: Compilar dependencias (SDL2 y libjpeg-turbo estáticas)
        run: scripts/dependencias.sh

      - name: Compilar DeckLink
        run: scripts/compilar.sh

      - name: Empaquetar
        run: scripts/empaquetar.sh

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "$GITHUB_EVENT_NAME" = "push" ] || TAG=v1.0
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes
          gh release create "$TAG" dist/DeckLink-SteamDeck.zip dist/DeckLink-Portatil.zip \
            --title "DeckLink-V.1" --notes-file .github/notas-release.md --target "$GITHUB_SHA"
